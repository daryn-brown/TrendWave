[package]
name = "trendwave"
version = "1.3.1"
description = "A background-first desktop app for detecting early stock momentum."
authors = ["Daryn Brown"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trendwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Percent-encode model-/tool-supplied tickers before interpolating them into
# pinned Yahoo URLs (already in the tree transitively via reqwest/url).
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
feed-rs = "2"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Robinhood Agentic (MCP) read-only integration: OS keychain for OAuth tokens,
# plus the primitives for an OAuth 2.1 PKCE authorization-code flow.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Native biometric unlock (macOS Touch ID / Windows Hello) gating the saved
# Robinhood session. App-enforced gate, not a keychain ACL.
robius-authentication = "0.1.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Read total physical RAM during first-run onboarding so we can recommend a
# local model that fits the machine. Only the `system` feature is enabled to
# keep the dependency (and compile time) small. Pinned below 0.39, which raised
# its MSRV beyond this toolchain; the memory API used here is unchanged.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
