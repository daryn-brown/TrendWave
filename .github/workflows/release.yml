name: release

# Build and publish signed, auto-updatable macOS and Windows apps whenever main's
# committed version is bumped. Pushes that don't change the version (docs, CI,
# refactors) are a clean no-op: the verify job below skips the build and the run
# stays green, so this workflow only does work — and only goes red — for a real
# release or a real problem. Each installed app checks the latest release
# for a newer signed bundle for its own platform and updates itself in place. Both
# platforms publish to the same `app-v<version>` release, and tauri-action merges
# them into a single multi-platform `latest.json` (keyed by `darwin-*` and
# `windows-x86_64`) that the updater reads — so Windows and macOS stay in lockstep
# off the same version bump.
#
# Publishing is atomic: both platforms build into a DRAFT release first, and only
# after latest.json describes both platforms and every bundle it points at is
# uploaded do we flip the draft to the public "latest" release. A draft is never
# served as "latest" and its latest.json is not published, so a half-finished or
# single-platform upload can never break the updater for installed apps — a re-run
# finishes the upload instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; newer pushes cancel an in-flight build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: GITHUB_TOKEN gets no scopes unless a job opts in.
permissions: {}

jobs:
  # Resolve and verify the version once, up front — before any platform build runs
  # or the protected signing environment is touched. The committed version is the
  # single source of truth: read it from tauri.conf.json (the version the bundle
  # and updater manifest actually ship), confirm package.json and Cargo.toml agree,
  # and decide whether there's anything to release. If a release for this version
  # is already published the version simply wasn't bumped — the normal state for
  # most pushes — so this job skips the build cleanly (a green, no-op run) rather
  # than failing. It only goes red on a genuine problem: the three version files
  # disagreeing, or a real bump missing its changelog entry.
  verify:
    runs-on: ubuntu-latest
    # Only needs to read repo contents and releases to resolve/verify the version.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      # 'true' only when this version has no published release yet — i.e. there is
      # actually something to build. The release and publish jobs gate on this.
      should_release: ${{ steps.ver.outputs.should_release }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't persist the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - name: Resolve and verify release version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          PKG=$(jq -r .version package.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Version mismatch — tauri.conf.json=$VERSION, package.json=$PKG, Cargo.toml=$CARGO. Set all three to the same value before merging to main."
            exit 1
          fi
          # A *published* release for this version means the version wasn't bumped:
          # the normal state for most pushes to main. That's not an error — skip the
          # build cleanly (green, no-op) so this workflow only turns red on a real
          # problem and stays trustworthy. A leftover *draft* is from a previous run
          # whose upload failed partway; the build legs below reuse it and re-upload
          # the missing assets, so treat that as a release to finish.
          DRAFT=$(gh release view "app-v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          if [ "$DRAFT" = "false" ]; then
            echo "::notice::app-v$VERSION is already published; no version bump, so there is nothing to release. Skipping the build (this is a normal, green no-op)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$DRAFT" = "true" ]; then
            echo "Reusing leftover draft app-v$VERSION from a previous failed run."
          fi
          echo "Releasing version $VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes from changelog
        id: notes
        # Only needed when actually releasing; skipped along with the build when the
        # version is already published, so an old release whose changelog entry was
        # since edited away can't make an ordinary push to main go red.
        if: steps.ver.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull this version's section out of CHANGELOG.md: every line between the
          # "## [<version>]" heading and the next "## " heading or link-reference
          # block, with surrounding blank lines trimmed. This becomes both the GitHub
          # release body and the in-app updater's "what's new" text, so each release
          # ships a real, curated description instead of a generic one.
          NOTES=$(awk -v ver="$VERSION" '
            found && (/^## / || /^\[[^][]+\]: /) { exit }
            found { buf[++n] = $0 }
            $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { found = 1 }
            END {
              s = 1
              while (s <= n && buf[s] ~ /^[[:space:]]*$/) s++
              while (n >= s && buf[n] ~ /^[[:space:]]*$/) n--
              for (i = s; i <= n; i++) print buf[i]
            }
          ' CHANGELOG.md)
          # Refuse to ship a release with no notes: the version was bumped but its
          # changelog entry is missing or empty. Fail here, before any build runs.
          if [ -z "$NOTES" ]; then
            echo "::error::No changelog entry for $VERSION. Add a '## [$VERSION]' section to CHANGELOG.md describing this release before merging to main."
            exit 1
          fi
          echo "Release notes for $VERSION:"
          echo "$NOTES"
          {
            echo "notes<<__TRENDWAVE_NOTES_EOF__"
            echo "$NOTES"
            echo "__TRENDWAVE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

  # Build, sign and stage each platform's bundle into the shared DRAFT release. The
  # two legs run one at a time (max-parallel: 1) so they never race to update the
  # shared latest.json: the macOS leg creates the draft and manifest, the Windows
  # leg merges its platform entry into the existing draft.
  release:
    needs: verify
    # Skip the whole build when there's nothing new to ship (version already
    # published). This is what keeps an ordinary push to main a green no-op.
    if: needs.verify.outputs.should_release == 'true'
    strategy:
      # Sequential legs with macOS first: if it fails, cancel Windows rather than
      # stage a Mac-less release — keeping the version free for a clean retry.
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            # Universal binary so the release runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            # NSIS-only: the recommended Windows updater installer, and it keeps the
            # updater manifest unambiguous (no NSIS-vs-MSI choice to get wrong).
            args: --bundles nsis
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    # Gate releases behind a protected `release` environment so required
    # reviewers must approve before the signing secrets are exposed.
    environment: release
    # Only the scope this job actually needs to upload to the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't persist the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Empty on Windows (host target is used); the macOS leg needs both arches
          # for the universal binary.
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Build into a DRAFT release. A draft is never the public "latest" release and
      # its latest.json is not served, so a half-finished upload can't break the
      # updater for installed apps. retryAttempts re-tries a transient build/upload
      # failure (e.g. the undici "other side closed" socket error) that would
      # otherwise abort the run after a single hiccup.
      - name: Build, sign and stage release (draft)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v${{ needs.verify.outputs.version }}
          releaseName: TrendWave v${{ needs.verify.outputs.version }}
          releaseBody: ${{ needs.verify.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Re-try a transient upload/build failure instead of leaving a
          # half-uploaded release behind.
          retryAttempts: 3
          args: ${{ matrix.args }}

  # Only after both platform legs have staged their bundles do we confirm the draft
  # is complete and flip it to the public latest release. If anything is missing we
  # leave it as a draft and fail, so the live updater keeps pointing at the last
  # good release and a re-run can finish the upload.
  publish:
    needs: [verify, release]
    # Matches the release job's gate; also skips cleanly if release was skipped.
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Only needs to confirm the staged assets and publish the release; no signing
    # secrets, so it deliberately stays out of the protected `release` environment.
    permissions:
      contents: write
    steps:
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so `gh` can't infer the repo from a git
          # remote — that made the release API calls below fail with "fatal: not a
          # git repository" and left the finished release stuck as a draft. Point
          # gh at the repo explicitly instead of adding a needless full checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          TAG="app-v$VERSION"
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber
          ASSETS=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Staged assets: $ASSETS"

          # latest.json must describe BOTH platforms; a manifest missing either one
          # would silently strand that platform's installed apps on their current
          # version while the other platform updates.
          for key in darwin windows; do
            if [ -z "$(jq -r --arg k "$key" '.platforms | keys[] | select(startswith($k))' manifest/latest.json)" ]; then
              echo "::error::latest.json has no $key platform entry; leaving $TAG as a draft so the live updater is unaffected. Re-run the workflow to finish the upload."
              exit 1
            fi
          done

          # Required assets = the known macOS outputs (the .app.tar.gz updater bundle,
          # the .dmg manual download and its signature) plus every bundle the manifest
          # points installed apps at — derived from latest.json so the Windows
          # installer name can't drift from tauri's bundle naming. A missing one means
          # a broken updater download, so stay a draft until it's there.
          MANIFEST_BUNDLES=$(jq -r '.platforms[].url | split("/") | last' manifest/latest.json | sort -u | tr '\n' ' ')
          for required in \
            latest.json \
            "TrendWave_${VERSION}_universal.dmg" \
            "TrendWave_universal.app.tar.gz" \
            "TrendWave_universal.app.tar.gz.sig" \
            $MANIFEST_BUNDLES; do
            case " $ASSETS " in
              *" $required "*) ;;
              *)
                echo "::error::Draft $TAG is missing '$required'; leaving it as a draft so the live updater is unaffected. Re-run the workflow to finish the upload."
                exit 1
                ;;
            esac
          done

          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG as the latest release."
