name: release

# Build and publish a signed, auto-updatable macOS app every time main changes
# (i.e. when a PR is merged). The running app checks the latest release for a
# newer signed bundle and updates itself in place.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; newer pushes cancel an in-flight build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: GITHUB_TOKEN gets no scopes unless a job opts in.
permissions: {}

jobs:
  release:
    runs-on: macos-latest
    # Gate releases behind a protected `release` environment so required
    # reviewers must approve before the signing secrets are exposed.
    environment: release
    # Only the scope this job actually needs to create the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't persist the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Each merge to main gets an incrementing version so the updater can tell
      # an installed build it is out of date. No version bump is committed.
      - name: Set version from run number
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          node -e "const fs=require('fs');const p='package.json';const c=JSON.parse(fs.readFileSync(p));c.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v${{ steps.ver.outputs.version }}
          releaseName: TrendWave v${{ steps.ver.outputs.version }}
          releaseBody: Automated build from the latest commit on main.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Universal binary so the release runs on both Apple Silicon and Intel Macs.
          args: --target universal-apple-darwin
