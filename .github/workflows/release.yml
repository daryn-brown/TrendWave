name: release

# Build and publish a signed, auto-updatable macOS app every time main changes
# (i.e. when a PR is merged). The running app checks the latest release for a
# newer signed bundle and updates itself in place.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; newer pushes cancel an in-flight build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: GITHUB_TOKEN gets no scopes unless a job opts in.
permissions: {}

jobs:
  release:
    runs-on: macos-latest
    # Gate releases behind a protected `release` environment so required
    # reviewers must approve before the signing secrets are exposed.
    environment: release
    # Only the scope this job actually needs to create the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't persist the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The committed version is the single source of truth. Read it from
      # tauri.conf.json (the version the bundle and updater manifest actually
      # ship), confirm package.json and Cargo.toml agree, and refuse to publish
      # if a release for this version already exists. A forgotten bump then fails
      # loudly here instead of silently re-shipping a stale version that
      # installed apps would never see as an update.
      - name: Resolve and verify release version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Version mismatch — tauri.conf.json=$VERSION, package.json=$PKG, Cargo.toml=$CARGO. Set all three to the same value before merging to main."
            exit 1
          fi
          # Block only when a *published* release for this version already
          # exists — that means the version wasn't bumped. A leftover *draft*
          # is from a previous run whose upload failed partway; the build step
          # below reuses it and re-uploads the missing assets, so don't block.
          DRAFT=$(gh release view "app-v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          if [ "$DRAFT" = "false" ]; then
            echo "::error::Release app-v$VERSION already exists. Bump the version in src-tauri/tauri.conf.json, package.json and src-tauri/Cargo.toml before merging to main."
            exit 1
          elif [ "$DRAFT" = "true" ]; then
            echo "Reusing leftover draft app-v$VERSION from a previous failed run."
          fi
          echo "Releasing version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build into a DRAFT release first. A draft is never the public "latest"
      # release and its latest.json is not served, so a half-finished upload
      # can't break the updater for installed apps. retryAttempts re-tries a
      # transient build/upload failure (e.g. the undici "other side closed"
      # socket error) that would otherwise abort the run after a single hiccup.
      - name: Build, sign and stage release (draft)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v${{ steps.ver.outputs.version }}
          releaseName: TrendWave v${{ steps.ver.outputs.version }}
          releaseBody: Automated build from the latest commit on main.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Re-try a transient upload/build failure instead of leaving a
          # half-uploaded release behind.
          retryAttempts: 3
          # Universal binary so the release runs on both Apple Silicon and Intel Macs.
          args: --target universal-apple-darwin

      # Only after every expected artifact is confirmed on the draft do we flip
      # it to the public latest release. If anything is missing we leave it as a
      # draft and fail, so the live updater keeps pointing at the last good
      # release and a re-run can finish the upload.
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ASSETS=$(gh release view "app-v$VERSION" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Staged assets: $ASSETS"
          for required in \
            "latest.json" \
            "TrendWave_${VERSION}_universal.dmg" \
            "TrendWave_universal.app.tar.gz" \
            "TrendWave_universal.app.tar.gz.sig"; do
            case " $ASSETS " in
              *" $required "*) ;;
              *)
                echo "::error::Draft app-v$VERSION is missing '$required'; leaving it as a draft so the live updater is unaffected. Re-run the workflow to finish the upload."
                exit 1
                ;;
            esac
          done
          gh release edit "app-v$VERSION" --draft=false --latest
          echo "Published app-v$VERSION as the latest release."
