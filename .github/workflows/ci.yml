name: ci

# Build + test gate for every PR (and pushes to main) so a green check actually
# means "the frontend type-checks and bundles, and the Rust backend compiles and
# its tests pass" on every OS we ship. CodeQL only runs static analysis
# (build-mode: none), so this is the workflow that catches a dependency bump or
# change that would otherwise break the auto-publishing release on main. Runs on
# both macos-latest and windows-latest to mirror the platforms release.yml builds,
# so a passing run is a faithful signal that the release build will succeed on
# each one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; a newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: GITHUB_TOKEN gets no scopes unless a job opts in.
permissions: {}

jobs:
  build-and-test:
    # Don't cancel the other OS's run when one fails — a Windows-only break should
    # still let the macOS leg report, and vice versa.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      # Only needs to read the repository contents to check it out and build.
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't persist the GITHUB_TOKEN in .git/config after checkout.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tsc + vite build: catches TypeScript and bundler-breaking dependency bumps.
      - name: Build frontend
        run: npm run build

      # Compiles the Tauri backend (incl. generate_context!) and runs unit tests:
      # catches Rust dependency bumps that break compilation or behavior.
      - name: Test backend
        working-directory: src-tauri
        run: cargo test --locked
